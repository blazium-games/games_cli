name: Chauffeur Upload

on:
  push:
    branches:
      - master
  pull_request:

env:
  TOOL_NAME: chauffeur

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check env.example
        run: python3 scripts/check_env_example.py || python scripts/check_env_example.py
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: Staticcheck and govulncheck
        if: runner.os == 'Linux'
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # The race detector needs cgo, which the Windows runner doesn't set up.
      - name: Vet and test
        run: |
          go vet ./...
          if [ "$RUNNER_OS" = Windows ]; then go test ./...; else go test -race ./...; fi

  resolve-version:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      simple_version: ${{ steps.finalize.outputs.simple_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Version with Bioblaze/game-semver-action
        id: version
        uses: Bioblaze/game-semver-action@v10
        with:
          personal_github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize version
        id: finalize
        run: |
          set -euo pipefail
          COMPUTED="${{ steps.version.outputs.simple_version }}"
          BASE="0.1.0"
          NPM_LATEST="$(curl -fsSL -H 'Cache-Control: no-cache' https://registry.npmjs.org/@blazium-games%2fcli/latest | jq -r '.version // empty' || true)"
          if [[ "$NPM_LATEST" == "null" ]]; then
            NPM_LATEST=""
          fi
          CANDIDATE="$(printf '%s\n%s\n' "$COMPUTED" "$BASE" | sort -V | tail -n1)"
          bump_patch() {
            local v="$1" major minor patch
            IFS=. read -r major minor patch <<< "$v"
            patch="${patch%%[^0-9]*}"
            echo "${major}.${minor}.$((patch + 1))"
          }
          if [[ -n "$NPM_LATEST" ]]; then
            HIGHER="$(printf '%s\n%s\n' "$CANDIDATE" "$NPM_LATEST" | sort -V | tail -n1)"
            if [[ "$HIGHER" == "$NPM_LATEST" ]]; then
              CANDIDATE="$(bump_patch "$NPM_LATEST")"
            fi
          fi
          echo "computed=${COMPUTED} npm_latest=${NPM_LATEST:-none} => ${CANDIDATE}"
          echo "simple_version=${CANDIDATE}" >> "$GITHUB_OUTPUT"

  build-and-upload:
    needs: [test, resolve-version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            arch: amd64
          - goos: linux
            arch: arm64
          - goos: windows
            arch: amd64
          - goos: darwin
            arch: amd64
          - goos: darwin
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Write VERSION
        run: echo "${{ needs.resolve-version.outputs.simple_version }}" > VERSION

      - name: Write .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is missing" >&2
            exit 1
          fi
          printf "%s" "$ENV_FILE" > .env

      - name: Build upload helper (host)
        run: go build -o dist/host/upload ./cmd/upload

      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        env:
          VERSION: ${{ needs.resolve-version.outputs.simple_version }}
        run: |
          set -euo pipefail
          go install github.com/tc-hib/go-winres@latest
          core="${VERSION%%-*}"
          IFS=. read -r major minor patch _ <<< "${core}.0.0.0"
          build=0
          if [ "$VERSION" != "$core" ]; then
            build="$(printf '%s' "${VERSION#*-}" | tr -cd '0-9')"
          fi
          ver="${major:-1}.${minor:-0}.${patch:-0}.${build:-0}"
          go-winres make --in winres/chauffeur.json --out . --product-version "$ver" --file-version "$ver"

      - name: Build chauffeur
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p "dist/${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${{ needs.resolve-version.outputs.simple_version }}" \
            -o "dist/${GOOS}-${GOARCH}/chauffeur${ext}" .

      - name: Package archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.resolve-version.outputs.simple_version }}
        run: |
          set -euo pipefail
          bin="chauffeur"
          [ "$GOOS" = "windows" ] && bin="chauffeur.exe"
          pkg_root="artifacts/${TOOL_NAME}/${GOOS}-${GOARCH}/${VERSION}"
          mkdir -p "$pkg_root/archive"
          cp "dist/${GOOS}-${GOARCH}/${bin}" "$pkg_root/${bin}"
          cp VERSION "$pkg_root/VERSION"
          (cd "$pkg_root" && zip -j "archive/default.zip" "${bin}" "VERSION")
          mv "$pkg_root/archive/default.zip" "$pkg_root/archive/default"

      - name: Upload archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.resolve-version.outputs.simple_version }}
        run: |
          set -euo pipefail
          archive="artifacts/${TOOL_NAME}/${GOOS}-${GOARCH}/${VERSION}/archive/default"
          for dest in "${VERSION}" latest; do
            ./dist/host/upload \
              --file "$archive" \
              --path "tools/${TOOL_NAME}/${GOOS}-${GOARCH}/${dest}/archive/" \
              --acl public-read \
              --storage STANDARD
          done

      - uses: actions/upload-artifact@v6
        with:
          name: chauffeur-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/${{ matrix.goos }}-${{ matrix.arch }}/chauffeur*
          if-no-files-found: error

  publish-npm:
    needs: [build-and-upload, resolve-version]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: chauffeur-*
          path: dist/bins

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Stage binaries and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          BLAZIUM_GAMES_CLI_VERSION: ${{ needs.resolve-version.outputs.simple_version }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_ACCESS_TOKEN is missing on blazium-games/games_cli. Publish fails until an admin copies the existing npm token onto this repo." >&2
            exit 1
          fi
          stage() {
            local goos="$1" arch="$2" pkg="$3" exe="$4"
            local src
            src="$(find "dist/bins/chauffeur-${goos}-${arch}" -type f -name "$exe" | head -n 1)"
            test -n "$src"
            mkdir -p "npm/packages/${pkg}/bin"
            cp "$src" "npm/packages/${pkg}/bin/${exe}"
            cp LICENSE "npm/packages/${pkg}/LICENSE"
          }
          stage linux amd64 cli-linux-x64 chauffeur
          stage linux arm64 cli-linux-arm64 chauffeur
          stage windows amd64 cli-win32-x64 chauffeur.exe
          stage darwin amd64 cli-darwin-x64 chauffeur
          stage darwin arm64 cli-darwin-arm64 chauffeur
          stage_docs() {
            local wrapper="$1"
            local scope="$2"
            local dir name rest os cpu
            for dir in npm/packages/"${wrapper}" npm/packages/"${wrapper}"-*; do
              cp LICENSE "${dir}/LICENSE"
              name=$(basename "$dir")
              if [ "$name" = "$wrapper" ]; then
                cp README.md "${dir}/README.md"
                continue
              fi
              rest="${name#"${wrapper}"-}"
              os="${rest%-*}"
              cpu="${rest#*-}"
              {
                echo "This package is the native ${os} ${cpu} binary for ${scope}."
                echo
                echo "Install \`${scope}\` instead of this package."
                echo
                cat README.md
              } > "${dir}/README.md"
            done
          }
          stage_docs cli "@blazium-games/cli"
          node npm/stamp-versions.cjs
          for pkg in cli-linux-x64 cli-linux-arm64 cli-win32-x64 cli-darwin-x64 cli-darwin-arm64 cli; do
            npm publish --access public "npm/packages/${pkg}"
          done
