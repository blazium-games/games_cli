name: Chauffeur Upload

on:
  push:
    branches:
      - main
      - master

env:
  TOOL_NAME: chauffeur

jobs:
  build-and-upload:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            arch: amd64
          - os: windows-latest
            goos: windows
            arch: amd64

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Generate Semver/w Build SHA
        id: semver
        uses: Bioblaze/game-semver-action@v10
        with:
          personal_github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write VERSION (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: echo "${{ steps.semver.outputs.revision_version }}" > VERSION

      - name: Write VERSION (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Content -Path "VERSION" -Value "${{ steps.semver.outputs.revision_version }}"

      - name: Write .env from secret (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is missing" >&2
            exit 1
          fi
          printf "%s" "$ENV_FILE" > .env

      - name: Write .env from secret (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if (-not $Env:ENV_FILE) {
            Write-Error "ENV_FILE secret is missing"
          }
          Set-Content -Path ".env" -Value $Env:ENV_FILE

      - name: Build chauffeur CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          mkdir -p "dist/${GOOS}-${GOARCH}"
          go build -ldflags "-X main.version=${{ steps.semver.outputs.revision_version }}" -o "dist/${GOOS}-${GOARCH}/chauffeur" .

      - name: Build chauffeur CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.goos }}-${{ matrix.arch }}" | Out-Null
          go build -ldflags "-X main.version=${{ steps.semver.outputs.revision_version }}" -o "dist/${{ matrix.goos }}-${{ matrix.arch }}/chauffeur.exe" .

      - name: Build upload tool (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          go build -o "dist/${GOOS}-${GOARCH}/upload" ./cmd/upload

      - name: Build upload tool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -o "dist/${{ matrix.goos }}-${{ matrix.arch }}/upload.exe" ./cmd/upload

      - name: Package archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
        run: |
          set -euo pipefail
          pkg_root="artifacts/${TOOL_NAME}/${GOOS}-${GOARCH}/${VERSION}"
          mkdir -p "$pkg_root/archive"
          cp "dist/${GOOS}-${GOARCH}/chauffeur" "$pkg_root/chauffeur"
          cp VERSION "$pkg_root/VERSION"
          (cd "$pkg_root" && zip -j "archive/default.zip" "chauffeur" "VERSION")
          mv "$pkg_root/archive/default.zip" "$pkg_root/archive/default"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
        run: |
          $pkgRoot = "artifacts/${{ env.TOOL_NAME }}/$($Env:GOOS)-$($Env:GOARCH)/$Env:VERSION"
          New-Item -ItemType Directory -Force -Path "$pkgRoot/archive" | Out-Null
          Copy-Item "dist/${{ matrix.goos }}-${{ matrix.arch }}/chauffeur.exe" "$pkgRoot/chauffeur.exe" -Force
          Copy-Item "VERSION" "$pkgRoot/VERSION" -Force
          Compress-Archive -Path "$pkgRoot/chauffeur.exe","$pkgRoot/VERSION" -DestinationPath "$pkgRoot/archive/default.zip" -Force
          Rename-Item "$pkgRoot/archive/default.zip" "default"

      - name: Package upload tool archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
        run: |
          set -euo pipefail
          pkg_root="artifacts/upload/${GOOS}-${GOARCH}/${VERSION}"
          mkdir -p "$pkg_root/archive"
          cp "dist/${GOOS}-${GOARCH}/upload" "$pkg_root/upload"
          cp VERSION "$pkg_root/VERSION"
          (cd "$pkg_root" && zip -j "archive/default.zip" "upload" "VERSION")
          mv "$pkg_root/archive/default.zip" "$pkg_root/archive/default"

      - name: Package upload tool archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
        run: |
          $pkgRoot = "artifacts/upload/$($Env:GOOS)-$($Env:GOARCH)/$Env:VERSION"
          New-Item -ItemType Directory -Force -Path "$pkgRoot/archive" | Out-Null
          Copy-Item "dist/${{ matrix.goos }}-${{ matrix.arch }}/upload.exe" "$pkgRoot/upload.exe" -Force
          Copy-Item "VERSION" "$pkgRoot/VERSION" -Force
          Compress-Archive -Path "$pkgRoot/upload.exe","$pkgRoot/VERSION" -DestinationPath "$pkgRoot/archive/default.zip" -Force
          Rename-Item "$pkgRoot/archive/default.zip" "default"

      - name: Upload archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
          UPLOAD_PATH: tools/${{ env.TOOL_NAME }}/${{ matrix.goos }}-${{ matrix.arch }}/${{ steps.semver.outputs.revision_version }}/archive/
        run: |
          set -euo pipefail
          ./dist/${GOOS}-${GOARCH}/upload \
            --file "artifacts/${TOOL_NAME}/${GOOS}-${GOARCH}/${VERSION}/archive/default" \
            --path "$UPLOAD_PATH" \
            --acl public-read \
            --storage STANDARD

      - name: Upload archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
          UPLOAD_PATH: tools/${{ env.TOOL_NAME }}/${{ matrix.goos }}-${{ matrix.arch }}/${{ steps.semver.outputs.revision_version }}/archive/
        run: |
          $archivePath = "artifacts/${{ env.TOOL_NAME }}/$($Env:GOOS)-$($Env:GOARCH)/$Env:VERSION/archive/default"
          ./dist/${{ matrix.goos }}-${{ matrix.arch }}/upload.exe `
            --file $archivePath `
            --path $Env:UPLOAD_PATH `
            --acl public-read `
            --storage STANDARD

      - name: Upload archive to latest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
          UPLOAD_PATH: tools/${{ env.TOOL_NAME }}/${{ matrix.goos }}-${{ matrix.arch }}/latest/archive/
        run: |
          set -euo pipefail
          ./dist/${GOOS}-${GOARCH}/upload \
            --file "artifacts/${TOOL_NAME}/${GOOS}-${GOARCH}/${VERSION}/archive/default" \
            --path "$UPLOAD_PATH" \
            --acl public-read \
            --storage STANDARD

      - name: Upload archive to latest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
          UPLOAD_PATH: tools/${{ env.TOOL_NAME }}/${{ matrix.goos }}-${{ matrix.arch }}/latest/archive/
        run: |
          $archivePath = "artifacts/${{ env.TOOL_NAME }}/$($Env:GOOS)-$($Env:GOARCH)/$Env:VERSION/archive/default"
          ./dist/${{ matrix.goos }}-${{ matrix.arch }}/upload.exe `
            --file $archivePath `
            --path $Env:UPLOAD_PATH `
            --acl public-read `
            --storage STANDARD

      - name: Upload upload tool archive (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
          UPLOAD_PATH: tools/upload/${{ matrix.goos }}-${{ matrix.arch }}/${{ steps.semver.outputs.revision_version }}/archive/
        run: |
          set -euo pipefail
          ./dist/${GOOS}-${GOARCH}/upload \
            --file "artifacts/upload/${GOOS}-${GOARCH}/${VERSION}/archive/default" \
            --path "$UPLOAD_PATH" \
            --acl public-read \
            --storage STANDARD

      - name: Upload upload tool archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
          UPLOAD_PATH: tools/upload/${{ matrix.goos }}-${{ matrix.arch }}/${{ steps.semver.outputs.revision_version }}/archive/
        run: |
          $archivePath = "artifacts/upload/$($Env:GOOS)-$($Env:GOARCH)/$Env:VERSION/archive/default"
          ./dist/${{ matrix.goos }}-${{ matrix.arch }}/upload.exe `
            --file $archivePath `
            --path $Env:UPLOAD_PATH `
            --acl public-read `
            --storage STANDARD

      - name: Upload upload tool archive to latest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
          UPLOAD_PATH: tools/upload/${{ matrix.goos }}-${{ matrix.arch }}/latest/archive/
        run: |
          set -euo pipefail
          ./dist/${GOOS}-${GOARCH}/upload \
            --file "artifacts/upload/${GOOS}-${GOARCH}/${VERSION}/archive/default" \
            --path "$UPLOAD_PATH" \
            --acl public-read \
            --storage STANDARD

      - name: Upload upload tool archive to latest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
          UPLOAD_PATH: tools/upload/${{ matrix.goos }}-${{ matrix.arch }}/latest/archive/
        run: |
          $archivePath = "artifacts/upload/$($Env:GOOS)-$($Env:GOARCH)/$Env:VERSION/archive/default"
          ./dist/${{ matrix.goos }}-${{ matrix.arch }}/upload.exe `
            --file $archivePath `
            --path $Env:UPLOAD_PATH `
            --acl public-read `
            --storage STANDARD

