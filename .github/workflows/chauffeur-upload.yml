name: Chauffeur Upload

on:
  push:
    branches:
      - master
  pull_request:

env:
  TOOL_NAME: chauffeur

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: Vet and test
        run: go vet ./... && go test ./...

  build-and-upload:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            arch: amd64
          - goos: linux
            arch: arm64
          - goos: windows
            arch: amd64
          - goos: darwin
            arch: amd64
          - goos: darwin
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Semver/w Build SHA
        id: semver
        uses: Bioblaze/game-semver-action@v10
        with:
          personal_github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write VERSION
        run: echo "${{ steps.semver.outputs.revision_version }}" > VERSION

      - name: Write .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ENV_FILE secret is missing" >&2
            exit 1
          fi
          printf "%s" "$ENV_FILE" > .env

      - name: Build upload helper (host)
        run: go build -o dist/host/upload ./cmd/upload

      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        env:
          VERSION: ${{ steps.semver.outputs.revision_version }}
        run: |
          set -euo pipefail
          go install github.com/tc-hib/go-winres@latest
          core="${VERSION%%-*}"
          IFS=. read -r major minor patch _ <<< "${core}.0.0.0"
          build=0
          if [ "$VERSION" != "$core" ]; then
            build="$(printf '%s' "${VERSION#*-}" | tr -cd '0-9')"
          fi
          ver="${major:-1}.${minor:-0}.${patch:-0}.${build:-0}"
          go-winres make --in winres/chauffeur.json --out . --product-version "$ver" --file-version "$ver"

      - name: Build chauffeur
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p "dist/${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.version=${{ steps.semver.outputs.revision_version }}" \
            -o "dist/${GOOS}-${GOARCH}/chauffeur${ext}" .

      - name: Package archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
        run: |
          set -euo pipefail
          bin="chauffeur"
          [ "$GOOS" = "windows" ] && bin="chauffeur.exe"
          pkg_root="artifacts/${TOOL_NAME}/${GOOS}-${GOARCH}/${VERSION}"
          mkdir -p "$pkg_root/archive"
          cp "dist/${GOOS}-${GOARCH}/${bin}" "$pkg_root/${bin}"
          cp VERSION "$pkg_root/VERSION"
          (cd "$pkg_root" && zip -j "archive/default.zip" "${bin}" "VERSION")
          mv "$pkg_root/archive/default.zip" "$pkg_root/archive/default"

      - name: Upload archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.semver.outputs.revision_version }}
        run: |
          set -euo pipefail
          archive="artifacts/${TOOL_NAME}/${GOOS}-${GOARCH}/${VERSION}/archive/default"
          for dest in "${VERSION}" latest; do
            ./dist/host/upload \
              --file "$archive" \
              --path "tools/${TOOL_NAME}/${GOOS}-${GOARCH}/${dest}/archive/" \
              --acl public-read \
              --storage STANDARD
          done
